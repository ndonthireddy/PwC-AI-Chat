// ─── US STORY DEFINITIONS ───
const US={
'US-01':'Opening & greeting (traveler)',
'US-02':'Opening & greeting (TA impersonation)',
'US-03':'Complete trip proposal',
'US-04':'Trip proposal fallback (one vertical fails)',
'US-05':'Search hotels by destination & dates',
'US-06':'Search specific hotel by name',
'US-07':'Hotel check-in on arrival day (overnight flights)',
'US-08':'Preferred hotels with corporate/project rates',
'US-09':'Hotels from colleague trips (V2)',
'US-10':'Search flights by destination & dates',
'US-11':'Search cars by destination & dates',
'US-12':'Search trains by destination & dates',
'US-13':'Search ground transfers by location & time',
'US-14':'Multi-vertical search trigger',
'US-15':'Clarify dates of travel',
'US-16':'Clarify office (multiple offices)',
'US-17':'Clarify time windows for flights',
'US-18':'Clarify GT pick-up & drop-off locations',
'US-19':'Clarify car pick-up & drop-off times',
'US-20':'React to change of dates',
'US-21':'React to change of destination',
'US-22':'Room options for selected hotel',
'US-23':'Room criteria in hotel search',
'US-24':'Flight fare options for selected flight',
'US-25':'Train fare options for selected train',
'US-26':'Select option and add to trip',
'US-27':'Match against existing trips (V2)',
'US-28':'Cross-sell / next vertical',
'US-29':'Trip summary after adding item',
'US-30':'Save preferences for future chats',
'US-31':'Preferred option sold out, show alternatives',
'US-32':'Preferred option not in results, show alternatives',
'US-33':'Hotel criteria too specific, broaden search',
'US-34':'Search expires, refresh results',
'US-35':'Off-topic, refocus to booking',
};

// ─── RENDER ───
const nav=document.getElementById('nav');
const cw=document.getElementById('cw');
const hT=document.getElementById('hTitle');
const hS=document.getElementById('hSub');
const pB=document.getElementById('pBtn');
const nB=document.getElementById('nBtn');
const usFilter=document.getElementById('usFilter');
let ci=-1;
let filteredList=[];

// Populate dropdown
Object.entries(US).forEach(([k,v])=>{
  const opt=document.createElement('option');
  opt.value=k;
  opt.textContent=`${k}: ${v}`;
  usFilter.appendChild(opt);
});

function md(t){
  return t
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/_(.+?)_/g,'<em>$1</em>')
    .replace(/(https?:\/\/[^\s<]+)/g,'<a href="#">$1</a>');
}

function getUSLabels(spec){
  if(!spec) return '';
  return spec.split(', ').map(us=>`<span class="us-tag">${us}</span>`).join(' ');
}

function build(filter){
  const dropdown=nav.querySelector('.us-dropdown');
  nav.innerHTML='';
  nav.appendChild(dropdown);
  filteredList=[];
  let cc='';
  D.forEach((s,i)=>{
    if(filter && (!s.spec || !s.spec.split(', ').includes(filter))) return;
    filteredList.push(i);
    if(s.c!==cc){
      cc=s.c;
      const cat=document.createElement('div');
      cat.className='nav-cat';
      cat.textContent=cc;
      nav.appendChild(cat);
    }
    const el=document.createElement('div');
    el.className='nav-item';
    el.dataset.i=i;
    const specShort=s.spec?`<span class="spec-short">${s.spec}</span>`:'';
    el.innerHTML=`<span class="n">${s.id}</span><span>${s.t}${specShort}</span>`;
    el.onclick=()=>sel(i);
    nav.appendChild(el);
  });
}

function filterByUS(val){
  build(val);
  if(filteredList.length>0){
    sel(filteredList[0]);
  } else {
    cw.innerHTML='<div class="empty"><div class="ic">🔍</div><p>No scenarios for this user story</p></div>';
    hT.textContent='No matches';
    hS.textContent='';
  }
}

function sel(i){
  ci=i;
  const s=D[i];
  document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
  const a=document.querySelector(`.nav-item[data-i="${i}"]`);
  if(a){a.classList.add('active');a.scrollIntoView({block:'nearest',behavior:'smooth'});}
  hT.textContent=`${s.id}. ${s.t}`;
  hS.textContent=s.c;
  const fi=filteredList.indexOf(i);
  pB.disabled=fi<=0;
  nB.disabled=fi>=filteredList.length-1;
  let h='<div class="chat">';
  h+=`<div class="tag">${s.c}, ${s.id}</div>`;
  if(s.spec) h+=`<div class="spec-ref">${getUSLabels(s.spec)}</div>`;
  if(s.u) h+=`<div class="u"><span>${s.u}</span></div>`;
  h+=`<div class="ai"><div class="av">✦</div><div class="ai-text">${md(s.a)}</div></div></div>`;
  cw.innerHTML=h;
  cw.scrollTop=0;
}

function go(d){
  const fi=filteredList.indexOf(ci);
  const ni=fi+d;
  if(ni>=0&&ni<filteredList.length) sel(filteredList[ni]);
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();go(1);}
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();go(-1);}
});

build('');
filteredList=D.map((_,i)=>i);
</script>
</body>
