// ─── RENDER ───
const nav=document.getElementById('nav');
const cw=document.getElementById('cw');
const hT=document.getElementById('hTitle');
const hS=document.getElementById('hSub');
const pB=document.getElementById('pBtn');
const nB=document.getElementById('nBtn');
let ci=-1;

function md(t){
  return t
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/_(.+?)_/g,'<em>$1</em>')
    .replace(/(https?:\/\/[^\s<]+)/g,'<a href="#">$1</a>');
}

function build(){
  let cc='';
  D.forEach((s,i)=>{
    if(s.c!==cc){
      cc=s.c;
      const cat=document.createElement('div');
      cat.className='nav-cat';
      cat.textContent=cc;
      nav.appendChild(cat);
    }
    const el=document.createElement('div');
    el.className='nav-item';
    el.dataset.i=i;
    el.innerHTML=`<span class="n">${s.id}</span>${s.t}`;
    el.onclick=()=>sel(i);
    nav.appendChild(el);
  });
}

function sel(i){
  ci=i;
  const s=D[i];
  document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
  const a=document.querySelector(`.nav-item[data-i="${i}"]`);
  if(a){a.classList.add('active');a.scrollIntoView({block:'nearest',behavior:'smooth'});}
  hT.textContent=`${s.id}. ${s.t}`;
  hS.textContent=s.c;
  pB.disabled=i===0;
  nB.disabled=i===D.length-1;
  let h='<div class="chat">';
  h+=`<div class="tag">${s.c} — ${s.id}</div>`;
  if(s.u) h+=`<div class="u"><span>${s.u}</span></div>`;
  h+=`<div class="ai"><div class="av">✦</div><div class="ai-text">${md(s.a)}</div></div></div>`;
  cw.innerHTML=h;
  cw.scrollTop=0;
}

function go(d){const n=ci+d;if(n>=0&&n<D.length)sel(n);}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();go(1);}
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();go(-1);}
});

build();
</script>
